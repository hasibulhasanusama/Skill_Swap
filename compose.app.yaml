# Local demo only. Base compose.yaml remains compatible with earlier installations.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://skillswap:skillswap@db:5432/skillswap
      NODE_ENV: development
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      STORAGE_DIR: /app/storage/private
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  uploads:
